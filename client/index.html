<!DOCTYPE html>
<html
    lang="en"
    ng-app="tceEventSphere"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="TCE Smart Event Management Portal - TCE EventSphere"
    >

    <meta
        name="theme-color"
        content="#4f46e5"
    >

    <title>
        TCE EventSphere
    </title>


    <!-- =================================================
         GOOGLE FONTS
    ================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =================================================
         BOOTSTRAP 5
    ================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =================================================
         FONT AWESOME
    ================================================== -->

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet"
    >


    <!-- =================================================
         AOS ANIMATION
    ================================================== -->

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css"
        rel="stylesheet"
    >


    <!-- =================================================
         APPLICATION CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="app.css"
    >

</head>


<body>


    <!-- =================================================
         ANGULARJS APPLICATION VIEW
    ================================================== -->

    <div
        ng-view
        class="app-view"
    ></div>


    <!-- =================================================
         GLOBAL LOADING OVERLAY
    ================================================== -->

    <div
        class="global-loading"
        ng-if="loading"
    >

        <div class="loading-spinner">

            <div
                class="spinner-border text-primary"
                role="status"
            >

                <span class="visually-hidden">
                    Loading...
                </span>

            </div>

            <p>
                Loading...
            </p>

        </div>

    </div>


    <!-- =================================================
         BOOTSTRAP JS
    ================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- =================================================
         AOS JS
    ================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"
    ></script>


    <!-- =================================================
         ANGULARJS
    ================================================== -->

    <script
        src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"
    ></script>

    <script
        src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-route.min.js"
    ></script>


    <!-- =================================================
         APPLICATION
    ================================================== -->

    <script src="app.js"></script>


    <!-- =================================================
         CONFIG
    ================================================== -->

    <script src="config/app.config.js"></script>


    <!-- =================================================
         SERVICES
    ================================================== -->

    <script src="services/api.service.js"></script>

    <script src="services/auth.service.js"></script>

    <script src="services/event.service.js"></script>

    <script src="services/registration.service.js"></script>

    <script src="services/notification.service.js"></script>

    <script src="services/od.service.js"></script>


    <!-- =================================================
         FILTERS
    ================================================== -->

    <script src="filters/custom.filters.js"></script>


    <!-- =================================================
         AUTH CONTROLLERS
    ================================================== -->

    <script src="controllers/auth/login.controller.js"></script>

    <script src="controllers/auth/register.controller.js"></script>


    <!-- =================================================
         STUDENT CONTROLLERS
    ================================================== -->

    <script src="controllers/student/dashboard.controller.js"></script>

    <script src="controllers/student/department-events.controller.js"></script>

    <script src="controllers/student/college-events.controller.js"></script>

    <script src="controllers/student/event-details.controller.js"></script>

    <script src="controllers/student/my-registrations.controller.js"></script>

    <script src="controllers/student/profile.controller.js"></script>

    <script src="controllers/student/notifications.controller.js"></script>


    <!-- =================================================
         COORDINATOR CONTROLLERS
    ================================================== -->

    <script src="controllers/coordinator/dashboard.controller.js"></script>

    <script src="controllers/coordinator/create-event.controller.js"></script>

    <script src="controllers/coordinator/manage-events.controller.js"></script>

    <script src="controllers/coordinator/participants.controller.js"></script>

    <script src="controllers/coordinator/profile.controller.js"></script>


    <!-- =================================================
         AOS INITIALIZATION
    ================================================== -->

    <script>

        document.addEventListener(
            'DOMContentLoaded',
            function () {

                if (
                    typeof AOS !== 'undefined'
                ) {

                    AOS.init({
                        duration: 800,
                        once: true,
                        offset: 50
                    });

                }

            }
        );

    </script>


</body>

</html>
